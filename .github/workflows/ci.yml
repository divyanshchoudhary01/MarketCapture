name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            clang-tidy

      - name: Configure
        run: |
          cmake -B build -G Ninja

      - name: Build
        run: |
          cmake --build build

      - name: Run Unit Tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Benchmarks
        run: |
          ./build/marketcapture_benchmark 100000

      - name: Run Hiring-Grade Showcase
        run: |
          ./build/marketcapture_showcase 10000 build/showcase

      - name: Run Threaded Hot Path
        run: |
          ./build/marketcapture_threaded 100000 build/threaded.ticks

      - name: Forced-Termination Soak Smoke
        env:
          BUILD_DIR: build
          ITERATIONS: 3
        run: ./scripts/soak_and_crash.sh build/soak

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure ASan and UBSan
        run: >
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMARKETCAPTURE_ENABLE_ASAN=ON
          -DMARKETCAPTURE_ENABLE_UBSAN=ON
          -DMARKETCAPTURE_BUILD_EXAMPLES=OFF
          -DMARKETCAPTURE_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build-sanitized
      - name: Test malformed and normal inputs
        run: ctest --test-dir build-sanitized --output-on-failure

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure fuzzers
        run: >
          cmake -S . -B build-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DMARKETCAPTURE_BUILD_FUZZERS=ON
          -DMARKETCAPTURE_BUILD_TESTS=OFF
          -DMARKETCAPTURE_BUILD_EXAMPLES=OFF
          -DMARKETCAPTURE_BUILD_BENCHMARKS=OFF
      - name: Build fuzz targets
        run: cmake --build build-fuzz
      - name: Smoke fuzz protocol boundaries
        run: |
          ./build-fuzz/fuzz_itch -max_total_time=5
          ./build-fuzz/fuzz_moldudp64 -max_total_time=5

  dpdk-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install DPDK development package
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libdpdk-dev
      - name: Configure DPDK adapter
        run: >
          cmake -S . -B build-dpdk -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMARKETCAPTURE_ENABLE_DPDK=ON
          -DMARKETCAPTURE_BUILD_TESTS=OFF
          -DMARKETCAPTURE_BUILD_EXAMPLES=OFF
          -DMARKETCAPTURE_BUILD_BENCHMARKS=OFF
      - name: Build DPDK adapter
        run: cmake --build build-dpdk

  io-uring-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install liburing development package
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config liburing-dev
      - name: Configure io_uring adapter
        run: >
          cmake -S . -B build-uring -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMARKETCAPTURE_ENABLE_IO_URING=ON
          -DMARKETCAPTURE_BUILD_EXAMPLES=OFF
          -DMARKETCAPTURE_BUILD_BENCHMARKS=OFF
      - name: Build and test io_uring adapter
        run: |
          cmake --build build-uring
          ctest --test-dir build-uring --output-on-failure
