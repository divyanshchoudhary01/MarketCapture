name: Linux evidence
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: bash scripts/linux_evidence.sh evidence/github-hosted
      - uses: actions/upload-artifact@v4
        with:
          name: linux-evidence-${{ github.sha }}
          path: evidence/github-hosted
          if-no-files-found: error
